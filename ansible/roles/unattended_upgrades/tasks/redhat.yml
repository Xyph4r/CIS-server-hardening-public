---
# dnf-automatic: security-only auto-install (Rocky/CentOS/RHEL family).
#
# dnf-automatic has no native "apply now, reboot at a scheduled time later"
# feature (unlike unattended-upgrades on Debian) - so this pins the update
# timer to a fixed, non-randomized time and runs a separate reboot-check
# timer an hour later, using `needs-restarting -r` (from dnf-utils) to only
# reboot when an applied update actually requires it.

- name: "Ensure dnf-automatic and dnf-utils are installed"
  ansible.builtin.dnf:
    name:
      - dnf-automatic
      - dnf-utils
    state: present
  tags: [auto_updates]

- name: "Configure dnf-automatic (security updates only, auto-apply)"
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
  loop:
    - { section: "commands", option: "upgrade_type", value: "security" }
    - { section: "commands", option: "apply_updates", value: "yes" }
    - { section: "emitters", option: "emit_via", value: "{{ 'stdio,email' if auto_updates_email | length > 0 else 'stdio' }}" }
    - { section: "email", option: "email_to", value: "{{ auto_updates_email if auto_updates_email | length > 0 else 'root' }}" }
  tags: [auto_updates]

- name: "Ensure the dnf-automatic-install timer override directory exists"
  ansible.builtin.file:
    path: /etc/systemd/system/dnf-automatic-install.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [auto_updates]

- name: "Pin dnf-automatic-install timer to a fixed, non-randomized daily time"
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnf-automatic-install.timer.d/cis-schedule.conf
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* 02:00:00
      RandomizedDelaySec=0
      Persistent=true
    owner: root
    group: root
    mode: "0644"
  tags: [auto_updates]

- name: "Enable and start dnf-automatic-install.timer"
  ansible.builtin.systemd:
    name: dnf-automatic-install.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [auto_updates]

- name: "Deploy the reboot-if-needed script"
  ansible.builtin.copy:
    dest: /usr/local/sbin/cis-reboot-if-needed.sh
    content: |
      #!/bin/bash
      # Managed by Ansible (unattended_upgrades role). Reboots ONLY if
      # needs-restarting -r indicates one is actually required (e.g. a new
      # kernel was installed) - not unconditionally on every run.
      needs-restarting -r >/dev/null 2>&1 || systemctl reboot
    owner: root
    group: root
    mode: "0750"
  when: auto_updates_reboot | bool
  tags: [auto_updates]

- name: "Deploy the reboot-check systemd service"
  ansible.builtin.copy:
    dest: /etc/systemd/system/cis-auto-reboot.service
    content: |
      [Unit]
      Description=CIS - reboot if a recent unattended update requires it

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/cis-reboot-if-needed.sh
    owner: root
    group: root
    mode: "0644"
  when: auto_updates_reboot | bool
  tags: [auto_updates]

- name: "Deploy the reboot-check systemd timer (fixed time, an hour after the update timer)"
  ansible.builtin.copy:
    dest: /etc/systemd/system/cis-auto-reboot.timer
    content: |
      [Unit]
      Description=CIS - daily check for a reboot required by unattended updates

      [Timer]
      OnCalendar=*-*-* {{ auto_updates_reboot_time }}:00
      RandomizedDelaySec=0
      Persistent=true

      [Install]
      WantedBy=timers.target
    owner: root
    group: root
    mode: "0644"
  when: auto_updates_reboot | bool
  tags: [auto_updates]

- name: "Enable and start the reboot-check timer"
  ansible.builtin.systemd:
    name: cis-auto-reboot.timer
    enabled: true
    state: started
    daemon_reload: true
  when: auto_updates_reboot | bool
  tags: [auto_updates]
