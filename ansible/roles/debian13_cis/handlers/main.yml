---
- name: restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted

- name: restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: rebuild aide database
  ansible.builtin.command: aideinit -y -f
  changed_when: true
  async: 3600
  poll: 0

- name: reload nftables
  ansible.builtin.service:
    name: nftables
    state: restarted
