---
# CIS Rocky Linux 10 - Section 1: Initial Setup
# Filesystem kernel modules, package/gpg integrity, MAC (SELinux),
# bootloader, process hardening, warning banners.
#
# NOTE: cloned from rocky9_cis - Rocky 10 (RHEL10-based) uses the same
# dnf/firewalld/SELinux/chrony/AIDE tooling as Rocky 9, so this is expected
# to be accurate, but hasn't been verified against a real 10.x box or an
# official CIS Rocky Linux 10 benchmark yet. See TODO.md.

# --- 1.1 Filesystem: disable unused/legacy filesystem kernel modules ---
- name: "1.1 | Disable unused filesystem kernel modules"
  ansible.builtin.copy:
    dest: "/etc/modprobe.d/cis-disabled-filesystems.conf"
    content: |
      {% for fs in cis_disable_filesystems %}
      install {{ fs }} /bin/true
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  tags: [cis_1.1]

- name: "1.1 | Ensure disabled filesystems are not currently loaded"
  community.general.modprobe:
    name: "{{ item }}"
    state: absent
  loop: "{{ cis_disable_filesystems }}"
  failed_when: false
  tags: [cis_1.1]

# --- 1.2 Package management / GPG integrity ---
- name: "1.2.1 | Ensure GPG check is globally activated (dnf.conf)"
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^gpgcheck'
    line: 'gpgcheck=1'
    insertafter: '^\[main\]'
  tags: [cis_1.2.1]

- name: "1.2.2 | Check for a legacy /etc/yum.repos.d directory"
  ansible.builtin.stat:
    path: /etc/yum.repos.d
  register: rocky10cis_yum_repos_d
  tags: [cis_1.2.2]

- name: "1.2.2 | Ensure repo GPG check is enforced for all .repo files"
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^gpgcheck\s*=\s*0'
    replace: 'gpgcheck=1'
  with_fileglob:
    - /etc/yum.repos.d/*.repo
  when: rocky10cis_yum_repos_d.stat.exists
  tags: [cis_1.2.2]

# --- 1.3 Mandatory Access Control: SELinux ---
- name: "1.3.1 | Ensure SELinux is installed"
  ansible.builtin.dnf:
    name: libselinux
    state: present
  when: rocky10cis_enforce_selinux
  tags: [cis_1.3.1]

- name: "1.3.2 | Ensure SELinux is not disabled in bootloader config"
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '\bselinux=0\b|\benforcing=0\b'
    replace: ''
  when: rocky10cis_enforce_selinux
  notify: update grub
  tags: [cis_1.3.2]

- name: "1.3.3 | Ensure SELinux policy is configured (targeted)"
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
  when: rocky10cis_enforce_selinux
  tags: [cis_1.3.3]

- name: "1.3.4 | Ensure no unconfined SELinux daemons exist"
  ansible.builtin.command: ps -eZ
  register: rocky10cis_selinux_ps
  changed_when: false
  failed_when: false
  when: rocky10cis_enforce_selinux
  tags: [cis_1.3.4, audit_only]

# --- 1.5 Process hardening ---
- name: "1.5.1 | Ensure ASLR is enabled"
  ansible.posix.sysctl:
    name: kernel.randomize_va_space
    value: "2"
    sysctl_set: true
    state: present
    reload: true
  tags: [cis_1.5.1]

- name: "1.5.2 | Ensure ptrace_scope is restricted"
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  tags: [cis_1.5.2]

- name: "1.5.3 | Ensure core dumps are restricted (limits.conf)"
  ansible.builtin.copy:
    dest: /etc/security/limits.d/cis-core-dumps.conf
    content: "* hard core 0\n"
    owner: root
    group: root
    mode: "0644"
  tags: [cis_1.5.3]

- name: "1.5.3 | Ensure core dumps are restricted (sysctl)"
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: "0"
    sysctl_set: true
    state: present
    reload: true
  tags: [cis_1.5.3]

# --- 1.7 Warning banners ---
- name: "1.7.1 | Set warning banner content (/etc/issue, /etc/issue.net, /etc/motd)"
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: "{{ cis_banner_text }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/issue
    - /etc/issue.net
    - /etc/motd
  tags: [cis_1.7.1]

# --- AIDE file integrity monitoring ---
- name: "1.4 | Install AIDE"
  ansible.builtin.dnf:
    name: aide
    state: present
  when: rocky10cis_configure_aide
  tags: [cis_1.4]

- name: "1.4 | Check whether AIDE database already exists"
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db.gz
  register: rocky10cis_aide_db
  when: rocky10cis_configure_aide
  tags: [cis_1.4]

- name: "1.4 | Initialize AIDE database (first run only, async)"
  ansible.builtin.command: aide --init
  when: rocky10cis_configure_aide and not rocky10cis_aide_db.stat.exists
  async: 3600
  poll: 0
  changed_when: true
  tags: [cis_1.4]

- name: "1.4 | Schedule daily AIDE integrity check"
  ansible.builtin.cron:
    name: "CIS - AIDE integrity check"
    special_time: daily
    job: "/usr/sbin/aide --check"
  when: rocky10cis_configure_aide
  tags: [cis_1.4]
