---
# Opt-in (fail2ban_enabled: false by default). Bans source IPs after
# repeated SSH auth failures - genuinely useful given key-only auth already
# makes brute-forcing futile (this just cuts the noise/connection churn),
# but NOT a CIS Benchmark control, and has a real self-lockout risk if your
# own IP isn't in fail2ban_ignoreip and something (a misconfigured agent
# offering the wrong key first, repeated Ansible reconnects, ...) trips
# maxretry from your own address. bantime is non-permanent by default
# (1h) specifically so a self-ban isn't catastrophic - it just expires.
#
# fail2ban_banaction is set per-OS in group_vars/<os>.yml to match that
# role's firewall backend (firewalld/nftables/iptables-under-ufw). Verify
# the action actually exists for your installed fail2ban version with:
#   ls /etc/fail2ban/action.d/

- name: Install fail2ban (RHEL family)
  ansible.builtin.dnf:
    name: fail2ban
    state: present
  when: fail2ban_enabled and ansible_facts['os_family'] == "RedHat"
  tags: [fail2ban]

- name: Install fail2ban (Debian family)
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when: fail2ban_enabled and ansible_facts['os_family'] == "Debian"
  tags: [fail2ban]

- name: Deploy fail2ban jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  when: fail2ban_enabled
  notify: restart fail2ban
  tags: [fail2ban]

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: fail2ban_enabled
  tags: [fail2ban]
