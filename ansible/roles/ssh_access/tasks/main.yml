---
# Bootstrap: creates the admin account and deploys the team's public keys to
# it, BEFORE any *_cis role runs - the access_authentication sections may
# disable password auth (cis_ssh_password_auth), so the key-based account
# has to exist and work first.
#
# First-ever connection to a freshly-delivered box (e.g. a VPS) is root
# with a password - that's a separate, one-time bootstrap step (see
# hosts.example.ini header). This role manages the account you actually
# want to use afterwards, not that initial root/password access.

- name: Refuse to continue without authorized keys when password auth is off
  ansible.builtin.assert:
    that:
      - cis_authorized_keys | length > 0
    fail_msg: >-
      cis_authorized_keys is empty but cis_ssh_password_auth is "no" -
      add your public key(s) to cis_authorized_keys in
      inventory/group_vars/all.yml first, or you'll be locked out once the
      hardening roles disable password auth.
  when:
    - cis_manage_authorized_keys | bool
    - cis_ssh_password_auth | default('no') == 'no'
  tags: [ssh_access]

- name: Determine the sudo-equivalent group for this OS family
  ansible.builtin.set_fact:
    cis_admin_group: "{{ 'wheel' if ansible_facts['os_family'] == 'RedHat' else 'sudo' }}"
  tags: [ssh_access]

- name: "Create the admin user ({{ cis_admin_username }})"
  ansible.builtin.user:
    name: "{{ cis_admin_username }}"
    groups: "{{ cis_admin_group }}"
    append: true
    shell: /bin/bash
    create_home: true
    state: present
    password: "{{ cis_admin_password_hash if cis_admin_password_hash | length > 0 else omit }}"
  when: cis_create_admin_user | bool
  no_log: "{{ cis_admin_password_hash | length > 0 }}"
  tags: [ssh_access]

- name: "Grant {{ cis_admin_username }} sudo access"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ cis_admin_username }}"
    content: "{{ cis_admin_username }} ALL=(ALL) {{ 'NOPASSWD:' if cis_admin_passwordless_sudo else '' }}ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: cis_create_admin_user | bool
  tags: [ssh_access]

- name: "Ensure {{ cis_ssh_admin_user }} has the approved SSH public keys"
  ansible.posix.authorized_key:
    user: "{{ cis_ssh_admin_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ cis_authorized_keys }}"
  when: cis_manage_authorized_keys | bool and cis_authorized_keys | length > 0
  tags: [ssh_access]
