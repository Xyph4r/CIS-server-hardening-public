; Copy to hosts.ini and fill in real inventory. hosts.ini is gitignored.
;
; Bootstrap note: a freshly-delivered server (e.g. a VPS) only has root,
; usually with a password, not a key yet. For that very first connection
; only, override the user and force password auth on the command line
; rather than committing root as the permanent default here:
;   ansible-playbook -i inventory/hosts.ini site.yml --tags ssh_access \
;     --limit rocky10 -e ansible_user=root --ask-pass
; Once ssh_access has created cis_admin_username and you've confirmed you
; can SSH in as that user with your key + sudo, switch ansible_user below to
; that username and run the rest of site.yml normally.

[rocky9]
; rocky-web-01.example.mil ansible_host=10.0.1.11

[rocky10]
; rocky-web-02.example.mil ansible_host=10.0.1.12

[centos10]
; centos-web-01.example.mil ansible_host=10.0.1.13

[debian12]
; debian-app-01.example.mil ansible_host=10.0.1.21

[debian13]
; debian-app-02.example.mil ansible_host=10.0.1.22

[ubuntu22]
; ubuntu-app-01.example.mil ansible_host=10.0.1.31

[ubuntu26]
; ubuntu-app-02.example.mil ansible_host=10.0.1.32

[cis_servers:children]
rocky9
rocky10
centos10
debian12
debian13
ubuntu22
ubuntu26

[cis_servers:vars]
ansible_user=ops
ansible_become=true
