---
cis_firewall_service: firewalld
cis_mac_type: selinux
cis_disable_filesystems:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - squashfs
  - udf
cis_time_sync_service: chronyd

# OpenSCAP - verify with: oscap info /usr/share/xml/scap/ssg/content/<file>
# Rocky 10 is very new; falls back to RHEL10 content if Rocky-specific
# content isn't published yet for your installed scap-security-guide version.
scap_datastream_candidates:
  - ssg-rocky-linux10-ds.xml
  - ssg-rhel10-ds.xml
scap_profile_id: xccdf_org.ssgproject.content_profile_cis

# fail2ban banaction matching this OS's firewall backend (firewalld).
# Verify against `ls /etc/fail2ban/action.d/` on the actual installed version.
fail2ban_banaction: firewallcmd-rich-rules
